apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vle8
      version: blue
  template:
    metadata:
      labels:
        app: vle8
        version: blue
    spec:
      containers:
        - name: web
          image: docker.io/library/vle8-blue:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
